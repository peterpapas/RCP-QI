[project]
name = "rcp-qi-research"
version = "0.1.0"
description = "Cost-aware baselines for an unproven recursive quantum search hypothesis"
readme = "README.md"
authors = [
    { name = "Peter Papas", email = "30211228+peterpapas@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.4",
    "scipy>=1.18.1",
]

[project.scripts]
rcp-qi-research = "rcp_qi_research.experiment:main"
rcp-qi-phase2 = "rcp_qi_research.multi_iteration:main"
rcp-qi-register = "rcp_qi_research.partition_register:main"
rcp-qi-sat = "rcp_qi_research.sat_benchmark:main"
rcp-qi-recursive = "rcp_qi_research.adaptive_recursive:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
