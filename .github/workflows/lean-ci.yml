name: Lean formal checks

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Elan
        run: |
          set -o pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reject unfinished proofs
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal/lean --include='*.lean'; then
            exit 1
          fi
      - name: Build pinned Lean project
        working-directory: formal/lean
        run: lake build
      - name: Audit theorem dependencies
        working-directory: formal/lean
        run: |
          lake env lean RCPQI/AxiomAudit.lean | tee axiom-audit.txt
          if grep -q 'sorryAx' axiom-audit.txt; then
            exit 1
          fi
