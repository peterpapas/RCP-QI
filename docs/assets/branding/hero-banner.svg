  <text x="68" y="294" fill="#dbe9f9" font-family="Arial,sans-serif" font-size="34">Recursive Complementary Partitioning</text>
  <text x="68" y="338" fill="#dbe9f9" font-family="Arial,sans-serif" font-size="34">with Quantum Interference</text>
  <text x="68" y="385" fill="#a8bfd6" font-family="Arial,sans-serif" font-size="21">A cost-aware investigation of structure, search and quantum limits.</text>
  <text x="69" y="460" fill="#8eaac2" font-family="Arial,sans-serif" font-size="17" letter-spacing="1.7">HYPOTHESIS  →  EXPERIMENT  →  CORRECTION  →  OPEN REVIEW</text>

