<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="490" viewBox="0 0 1600 490" role="img" aria-labelledby="title desc">
  <title id="title">RCP-QI research archive</title>
  <desc id="desc">An original dark-navy banner. Candidate states and interference waves lead toward an illustrative branching search tree; an amber barrier marks the cost of identifying a partition.</desc>
  <defs>
    <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#091727"/><stop offset=".58" stop-color="#0b1930"/><stop offset="1" stop-color="#111a35"/></linearGradient>
    <linearGradient id="path" x2="1"><stop stop-color="#57a9ff"/><stop offset="1" stop-color="#4fe2e0"/></linearGradient>
    <linearGradient id="wave" x2="1"><stop stop-color="#8d9eff"/><stop offset=".52" stop-color="#5de3e6"/><stop offset="1" stop-color="#b89df8"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#29415a" stroke-width="1" opacity=".26"/></pattern>
  </defs>
  <rect width="1600" height="490" rx="22" fill="url(#ground)"/>
  <rect width="1600" height="490" rx="22" fill="url(#grid)"/>
  <path d="M0 426H1600" stroke="#344c64" stroke-width="1"/>
